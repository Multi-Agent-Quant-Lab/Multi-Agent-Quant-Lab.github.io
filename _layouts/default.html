<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0e0f">

  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

  {% seo %}

  <!-- Distinctive type: Archivo (display) + IBM Plex Mono (system/data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <!-- CRT atmosphere overlays -->
  <div class="fx fx-scanlines" aria-hidden="true"></div>
  <div class="fx fx-vignette" aria-hidden="true"></div>
  <div class="fx fx-grid" aria-hidden="true"></div>

  {{ content }}

  <script src="{{ '/assets/js/terminal.js' | relative_url }}" defer></script>
</body>
</html>
