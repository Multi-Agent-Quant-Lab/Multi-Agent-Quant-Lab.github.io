# ── Multi-Agent Quant Lab ─────────────────────────────────
# GitHub Pages org site → served at the domain root.

title: "Multi-Agent Quant Lab"
title_ko: "멀티에이전트 퀀트 랩"
tagline_ko: "AI 에이전트로 굴러가는 알고리즘 트레이딩 시스템을 만든다"
tagline_en: "Building algorithmic trading systems that run on AI agents"
description: >-
  An open study building real, live-ready algorithmic trading systems
  with AI coding agents (Claude, Codex, Gemini) across stock & crypto markets.

url: "https://multi-agent-quant-lab.github.io"
baseurl: ""

lang: "en"
timezone: "Asia/Seoul"

# Brand / contact
github_org: "Multi-Agent-Quant-Lab"
kakao: "https://open.kakao.com/me/minsuksung"
telegram: "https://t.me/minsuksung"

# ── Build ─────────────────────────────────────────────────
markdown: kramdown
permalink: pretty

sass:
  style: compressed

collections:
  activities:
    output: true
    permalink: /activities/:name/

defaults:
  - scope: { path: "", type: "activities" }
    values: { layout: "activity" }

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .omc
